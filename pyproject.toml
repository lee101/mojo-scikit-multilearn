[project]
name = "mojo-scikit-multilearn"
version = "0.1.0"
description = "Mojo-accelerated multi-label transformation and classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "scikit-multilearn", "multi-label", "machine-learning"]
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "scikit-multilearn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
